[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "vetorial-agente"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jsonschema>=4.23,<5", "pypdf>=6,<7", "regex>=2025.11"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pillow>=12,<14", "reportlab>=4,<6"]
[tool.setuptools.packages.find]
include = ["vetorial_agent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
vetorial_agent = ["prompts/*", "pricing.json", "snapshot.schema.json"]
